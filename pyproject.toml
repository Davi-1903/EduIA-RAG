[project]
name = "eduia-rag"
version = "0.1.0"
description = "Teste de RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.2",
    "loguru>=0.7.3",
    "markitdown-ocr>=0.1.1",
    "markitdown[docx,pdf,pptx]>=0.1.8",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "tabulate>=0.10.0",
    "tqdm>=4.70.1",
    "uuid>=1.30",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
include = ["*.py"]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
lines-after-imports = 2

[project.scripts]
convert = "pipeline.ingestion.converter:main"
embed = "pipeline.ingestion.embeddings:app"
record = "pipeline.cli.record:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
