[project]
name = "eduia-rag"
version = "0.1.0"
description = "Teste de RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "markitdown[docx,pdf,pptx]>=0.1.7",
    "sentence-transformers>=6.1.0",
    "uuid>=1.30",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
include = ["*.py"]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
lines-after-imports = 2
