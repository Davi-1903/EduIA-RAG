[project]
name = "eduia-rag"
version = "0.1.0"
description = "Teste de RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "markitdown[docx,pdf,pptx]>=0.1.7",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
include = ["*.py"]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
lines-after-imports = 2
